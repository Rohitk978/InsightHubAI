{% extends 'header.html' %}

{% block title %}Error{% endblock %}

{% block content %}
<section class="page-heading">
    <div class="eyebrow">SOMETHING WENT WRONG</div>

    <h1>
        Let's get you
        <span class="gradient-text">back on track.</span>
    </h1>
</section>

<section class="panel error-panel">
    <div class="error-symbol">!</div>

    <h2>We couldn't complete that request.</h2>

    <p>{{ error }}</p>

    <a href="/chat" class="btn btn-blue">
        Back to Document Chat
    </a>
</section>
{% endblock %}
