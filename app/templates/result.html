{% extends 'header.html' %}

{% block title %}Summary{% endblock %}

{% block content %}
<section class="page-heading">
    <div class="eyebrow">SUMMARY RESULT</div>

    <h1>
        Here is your
        <span class="gradient-text">summary.</span>
    </h1>
</section>

<section class="panel translation-panel">
    <div class="output-heading">
        <h2 class="section-title">Summary</h2>

        <button
            type="button"
            id="copy-result"
            class="btn btn-blue"
        >
            Copy Summary
        </button>
    </div>

    <div id="result-output" class="translation-output">{{ result }}</div>

    <p id="copy-status" class="form-help" role="status" aria-live="polite"></p>

    <div class="form-actions">
        <a
            href="{{ url_for('summarization.summarize') }}"
            class="btn btn-secondary"
        >
            Summarize Another
        </a>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    const button = document.getElementById("copy-result");
    const output = document.getElementById("result-output");
    const status = document.getElementById("copy-status");

    if (!button || !output || !status) {
        return;
    }

    button.addEventListener("click", async () => {
        try {
            await navigator.clipboard.writeText(output.textContent);
            status.textContent = "Summary copied successfully.";
        } catch (error) {
            status.textContent =
                "Copy failed. Please select and copy the summary manually.";
        }
    });
});
</script>
{% endblock %}
